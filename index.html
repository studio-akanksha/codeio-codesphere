<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#120d07" />
    <meta name="description" content="CodeSphere is where curious minds at BMSCE explore technology, collaborate on ideas, and build things that matter." />
    <title>CodeSphere — A System of Ideas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Roboto:wght@700&display=swap" rel="stylesheet" />
    <script>
      try {
        const storedTheme = localStorage.getItem("theme");
        document.documentElement.classList.toggle("dark", storedTheme !== "light");
      } catch {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/api/platform/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
